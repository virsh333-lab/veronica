[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HarshThakur27", email = "harsh273003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "deepagents>=0.7.7",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.6",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pymongo>=4.17.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.0",
    "sib-api-v3-sdk>=7.6.0",
    "tavily-python>=0.7.27",
    "unstructured>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
